<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0e9dc">
<meta name="description" content="给妈妈的一张生日唱片。">
<title>给妈妈的生日唱片</title>
<style>
:root {
  color-scheme:light; --paper:#f0e9dc; --ink:#302821; --muted:#67584b; --line:#bfa990;
  --copper:#8e4c3e; --cream:#fff1d4; --ease:cubic-bezier(.24,.72,.27,1);
  --serif:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }
html { min-width:280px; }
body {
  margin:0; color:var(--ink); font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at 32% 5%,#fff8ea,transparent 65%),var(--paper);
}
button,input { font:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button:focus-visible,input:focus-visible { outline:2px solid #96663f; outline-offset:6px; }
.definitions { position:absolute; width:0; height:0; overflow:hidden; pointer-events:none; }
.layout {
  width:min(100%,1270px); min-height:100vh; min-height:100svh; margin:auto;
  padding:max(19px,env(safe-area-inset-top)) clamp(20px,4.7vw,66px)
    max(22px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
.masthead {
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:0 0 14px; border-bottom:1px solid #bba48888;
}
.brand { display:flex; align-items:center; gap:9px; font:400 17px/1.2 var(--serif); letter-spacing:.15em; }
.brand svg { width:22px; height:22px; color:#925f45; }
.steps { display:flex; gap:6px; padding:0; margin:0; list-style:none; }
.steps li {
  width:13px; height:2px; border-radius:3px; background:#b5a18b;
  transition:width .38s var(--ease),background .38s;
}
.steps li[aria-current="step"] { width:26px; background:#8e4c3e; }
main { flex:1; display:grid; align-items:center; }
.chapter { padding-top:clamp(16px,3vh,43px); }
.chapter.entering { animation:page-in .61s var(--ease) both; }
@keyframes page-in { from { opacity:0; transform:translateY(8px); } }
.spread {
  display:grid; grid-template-columns:minmax(240px,.82fr) minmax(0,1.18fr);
  align-items:center; gap:clamp(24px,5.6vw,76px);
}
.copy { padding:12px 0; min-width:0; }
.eyebrow {
  display:flex; align-items:center; gap:12px; margin:0 0 18px; color:#824d3d;
  font-size:.77rem; letter-spacing:.2em;
}
.eyebrow::before { content:""; width:26px; height:1px; background:#ab705b; }
.copy h1,.copy h2 {
  margin:0; font:400 clamp(39px,4.3vw,65px)/1.12 var(--serif);
  letter-spacing:.027em; text-wrap:balance;
}
.copy h1:focus,.copy h2:focus { outline:none; }
.description { margin:clamp(13px,2.7vh,30px) 0 0; max-width:25em; color:var(--muted); line-height:1.85; font-size:clamp(15px,1.35vw,18px); }

.pane {
  --light:#815044; --dark:#302024;
  isolation:isolate; position:relative; width:100%; max-width:690px; justify-self:center;
  border:1px solid #594138; border-radius:9px; overflow:hidden; aspect-ratio:640/500;
  background:radial-gradient(ellipse at 48% 26%,var(--light) 4%,transparent 72%),var(--dark);
  box-shadow:0 18px 38px #5e40352b,0 2px 5px #51382b38;
}
.pane::before {
  content:""; position:absolute; inset:clamp(8px,1.55vw,15px); z-index:3;
  border:1px solid #f8d8b13a; border-radius:5px; pointer-events:none;
}
.pane::after {
  content:""; position:absolute; inset:0; z-index:-1; opacity:.28; pointer-events:none;
  background:repeating-linear-gradient(130deg,transparent 0 3px,#fff1d409 3px 4px);
  mask-image:radial-gradient(ellipse at 50% 48%,#000,transparent 82%);
}

.stage-record { --light:#5f624e; --dark:#282b27; }
.stage-finale { --light:#8a504c; --dark:#42282b; }
.art { position:absolute; inset:0; display:block; width:100%; height:100%; pointer-events:none; }
.hit { position:absolute; border:0; background:none; color:var(--cream); padding:0; }
.gift-hit { inset:29% 22% 14%; border-radius:9px; }
.gift-hit .hit-mark {
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  border:1px solid #f7d7a38c; color:#fff1d8; background:#422a2de0;
  letter-spacing:.09em; border-radius:4px; padding:8px 13px; white-space:nowrap;
}
.record-hit {
  width:clamp(45px,8.3%,55px); aspect-ratio:1; display:grid; place-items:center;
  transform:translate(-50%,-50%); border-radius:50%;
}


.record-hit {
  top:48.8%; left:43%; background:#793d35; border:1px solid #ffdcaa;
  box-shadow:0 0 0 4px #e4a47941,0 5px 12px #21191366;
}
.record-hit svg { width:48%; height:48%; fill:#fff2da; }
.hit:focus-visible { outline-color:#ffdfa5; outline-offset:5px; }
.hit-mark,.record-hit { animation:cue 4s ease-in-out infinite; }
.chapter.urgent .hit-mark,.chapter.urgent .record-hit { animation-duration:2.2s; }
@keyframes cue {
  0%,100% { box-shadow:0 0 0 1px #f4d1a64a,0 0 5px #efc1842b; }
  45% { box-shadow:0 0 0 3px #ffe0ad5c,0 0 22px #ffc78e93; }
}
.hit:hover .hit-mark,.record-hit:hover { background-color:#9a5546cc; }

.gift-lid {
  transform-origin:326px 225px; transition:transform .85s var(--ease),opacity .65s var(--ease);
}
.gift-hidden-record { opacity:0; transform:translateY(30px) rotate(5deg); transform-origin:320px 280px; }
.stage-gift.opened .gift-lid { transform:translate(-82px,-90px) rotate(-16deg); opacity:.92; }
.stage-gift.opened .gift-hidden-record { animation:record-rise .88s var(--ease) .14s both; }
@keyframes record-rise { to { opacity:1; transform:translate(21px,-54px) rotate(-13deg); } }
.gift-sparks { opacity:0; transform-origin:335px 222px; }
.stage-gift.opened .gift-sparks { animation:gift-sparks 1.06s var(--ease) both; }
@keyframes gift-sparks { 0% { opacity:0; transform:scale(.57); } 40% { opacity:1; } 100% { opacity:.48; transform:scale(1.12); } }




.platter { transform-origin:275px 244px; animation:spin 8.5s linear infinite paused; }
.stage-record.playing .platter { animation-play-state:running; }
@keyframes spin { to { transform:rotate(360deg); } }
.tonearm { transform-origin:493px 148px; transition:transform .61s var(--ease); }
.stage-record.playing .tonearm { transform:rotate(27deg); }
.media .pane { margin-inline:auto; }
.player {
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px;
  margin:10px auto 0; padding:9px 13px; max-width:690px; min-height:45px;
  border:1px solid #bea489; border-radius:5px; background:#faf0de; color:#6d5141;
  font-size:.78rem; font-variant-numeric:tabular-nums;
}
.player input {
  width:100%; height:26px; margin:0; accent-color:#8e4c3e; cursor:pointer; min-width:0;
}
.audio-note { margin:7px 0 0; font-size:.79rem; line-height:1.45; color:#794638; }
.actions { min-height:53px; display:flex; justify-content:flex-end; align-items:end; margin:clamp(10px,2.1vh,20px) 0 0; }
.next {
  display:inline-flex; align-items:center; justify-content:center; gap:15px; min-height:46px;
  padding:9px 18px; border:1px solid #6b3b31; border-radius:4px; color:#fff6e4;
  background:#783f35; letter-spacing:.07em; animation:page-in .44s var(--ease) both;
  transition:background .25s;
}
.next:hover { background:#8f4c40; }
.next svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.finish-rays { transform-origin:325px 238px; animation:gift-sparks 1.23s var(--ease) both; }
@media (max-width:735px) {
  .layout { padding-inline:clamp(16px,5.3vw,40px); }
  .spread { grid-template-columns:minmax(0,1fr); gap:16px; }
  .copy { padding:3px 0 0; }
  .eyebrow { margin-bottom:9px; }
  .copy h1,.copy h2 { font-size:clamp(32px,8.4vw,54px); line-height:1.12; }
  .description { margin-top:10px; }

  .actions { justify-content:stretch; }
  .next { width:100%; min-height:48px; }
  .gift-hit .hit-mark { padding:6px 10px; font-size:.75rem; }
}
@media (orientation:landscape) and (max-height:520px) and (min-width:540px) {
  .layout { padding:12px clamp(20px,5vw,50px) 14px; }
  .masthead { padding-bottom:9px; }
  .chapter { padding-top:12px; }
  .spread { grid-template-columns:minmax(140px,.83fr) minmax(0,1.17fr); gap:clamp(14px,5vw,42px); }
  .pane { width:min(100%,calc(100svh * .68)); }
  .copy h1,.copy h2 { font-size:clamp(29px,8vh,51px); }
  .eyebrow { margin-bottom:8px; }
  .description { margin-top:7px; }
  .player { width:min(100%,calc(100svh * .68)); min-height:39px; padding-block:4px; }
  .actions { min-height:42px; margin-top:8px; }
  .next { min-height:40px; width:auto; min-width:120px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; }
  .stage-gift.opened .gift-hidden-record { opacity:1; transform:translate(21px,-54px) rotate(-13deg); }
  .stage-gift.opened .gift-sparks { opacity:.48; }

}
</style>
</head>

</div>

<script>
(() => {
  const one = (selector, root = document) => root.querySelector(selector);
  const chapters = Array.from(document.querySelectorAll('.chapter'));
  const ticks = Array.from(document.querySelectorAll('.steps li'));
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const gift = one('.stage-gift');
  const giftHit = one('.gift-hit');
  const record = one('.stage-record');
  const recordHit = one('.record-hit');
  const playIcon = one('.play-icon', recordHit);
  const pauseIcon = one('.pause-icon', recordHit);
  const audio = one('#birthday-audio');
  const seek = one('.seek');
  const elapsed = one('.elapsed');
  const duration = one('.duration');
  const audioNote = one('.audio-note');
  let current = 0;
  let hintTimer = 0;
  let scrubbing = false;

  function invite() {
    clearTimeout(hintTimer);
    const chapter = chapters[current];
    if (current < 2) hintTimer = setTimeout(() => {
      if (chapter === chapters[current] && (current === 0 || one('.next', chapter).hidden)) chapter.classList.add('urgent');
    }, 3800);
  }

  function complete(chapter) {
    chapter.classList.remove('urgent');
    clearTimeout(hintTimer);
    one('.next', chapter).hidden = false;
  }

  function show(index) {
    current = index;
    chapters.forEach((chapter, i) => {
      chapter.hidden = i !== index;
      chapter.classList.toggle('entering', i === index);
      chapter.classList.remove('urgent');
      if (i === index) ticks[i].setAttribute('aria-current', 'step');
      else ticks[i].removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    one('h1,h2', chapters[index]).focus({ preventScroll:true });
    invite();
  }

  function reset() {
    audio.pause();
    if (audio.readyState) audio.currentTime = 0;
    gift.classList.remove('opened');
    giftHit.hidden = false;
    audioNote.hidden = true;
    one('.next', chapters[1]).hidden = true;
  }

  chapters.forEach((chapter, index) => {
    const next = one('.next', chapter);
    if (!next) return;
    next.addEventListener('click', () => {
      if (index !== current || next.hidden) return;
      if (index === 1) audio.pause();
      if (index === 2) {
        reset();
        show(0);
      } else show(index + 1);
    });
  });

  giftHit.addEventListener('click', () => {
    giftHit.hidden = true;
    gift.classList.add('opened');
    window.setTimeout(() => show(1), reducedMotion.matches ? 0 : 1060);
  });

  function clock(seconds) {
    const time = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
    return Math.floor(time / 60) + ':' + String(time % 60).padStart(2, '0');
  }

  function updateTimeline() {
    const ready = Number.isFinite(audio.duration) && audio.duration > 0;
    seek.disabled = !ready;
    seek.max = ready ? audio.duration : 1;
    if (!scrubbing) seek.value = audio.currentTime;
    elapsed.textContent = clock(audio.currentTime);
    duration.textContent = clock(audio.duration);
    seek.setAttribute('aria-valuetext', elapsed.textContent + ' / ' + duration.textContent);
  }

  function updatePlayback() {
    const playing = !audio.paused && !audio.ended;
    record.classList.toggle('playing', playing);
    playIcon.toggleAttribute('hidden',playing);
    pauseIcon.toggleAttribute('hidden',!playing);
    recordHit.setAttribute('aria-label', playing ? '暂停录音' : '播放录音');
  }

  function showAudioNote(message) {
    if (current !== 1) return;
    audioNote.textContent = message;
    audioNote.hidden = false;
  }

  recordHit.addEventListener('click', () => {
    complete(chapters[1]);
    if (!audio.paused && !audio.ended) {
      audio.pause();
      updatePlayback();
      return;
    }
    audioNote.hidden = true;
    if (audio.ended) audio.currentTime = 0;
    audio.play().catch(error => {
      if (error.name === 'AbortError') return;
      if (audio.error) showAudioNote('录音暂时无法播放。请确认音频和网页在同一个目录。');
      else showAudioNote('请再点一次唱片播放录音。');
    });
  });

  seek.addEventListener('pointerdown', () => { scrubbing = true; });
  window.addEventListener('pointerup', () => { scrubbing = false; });
  window.addEventListener('pointercancel', () => { scrubbing = false; });
  seek.addEventListener('blur', () => { scrubbing = false; });
  seek.addEventListener('input', () => {
    audio.currentTime = Number(seek.value);
    updateTimeline();
  });
  ['loadedmetadata','durationchange','timeupdate','seeked'].forEach(event => audio.addEventListener(event, updateTimeline));
  ['play','pause','ended','emptied','error'].forEach(event => audio.addEventListener(event, updatePlayback));
  invite();
})();
</script>
</body>
